aid: dialup
name: Dialup
description: 'Dialup is a voice-chat app that revives the magic of talking on the phone by pairing people
  for one-on-one calls based on shared interests. It automates recurring, scheduled calls so users connect
  serendipitously with friends, communities, or complete strangers around the world without any manual
  coordination. Callers opt in with custom caller IDs rather than random numbers, and the free service
  is available on iOS and Android. Dialup is a Bloomberg Beta portfolio company; it operates as a consumer
  social/communication application and does not currently publish a public developer API.'
